<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0}
body{background:#fff;font-family:"PingFang SC",system-ui;color:#0a0a0a;display:flex;justify-content:center}
.p{width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
.bar{height:52px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:.5px solid #ececf0}
.bar b{font-size:16px}
.bar .q{position:absolute;right:14px;width:24px;height:24px;border-radius:50%;border:1px solid #dcdce2;color:#8a8a8e;font-size:13px;display:grid;place-items:center}
.body{flex:1;overflow:auto;padding:0 22px 40px}
.h{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin:22px 0 6px}
.sub{font-size:13px;color:#8a8a8e;margin-bottom:18px}
.row{display:flex;align-items:flex-start;gap:14px;padding:18px 0;border-top:.5px solid #ececf0}
.row:last-child{border-bottom:.5px solid #ececf0}
.n{font-size:11px;color:#b4b4b8;width:18px;padding-top:3px}
.t{font-size:17px;line-height:24px;font-weight:500}
.d{font-size:13px;line-height:19px;color:#8a8a8e;margin-top:3px}
.chev{margin-left:auto;color:#c9c9cd;align-self:center}
.tip{background:#f6f6f8;border-radius:16px;padding:14px;margin-top:22px;font-size:12px;line-height:19px;color:#6e6e73}
</style></head><body><div class="p">
<div class="bar"><b>美化工坊</b><span class="q">?</span></div>
<div class="body">
<div class="h">外观实验室</div>
<div class="sub">选一个界面，单独改它。</div>
<div class="row"><span class="n">01</span><div><div class="t">聊天与线下</div><div class="d">气泡、背景、输入栏</div></div><span class="chev">›</span></div>
<div class="row"><span class="n">02</span><div><div class="t">消息页装饰</div><div class="d">列表、联系人、动态、我的</div></div><span class="chev">›</span></div>
<div class="row"><span class="n">03</span><div><div class="t">心声美化</div><div class="d">写法、卡片、出现方式</div></div><span class="chev">›</span></div>
<div class="row"><span class="n">04</span><div><div class="t">样式类名</div><div class="d">可复制的选择器，带中文说明</div></div><span class="chev">›</span></div>
<div class="row"><span class="n">05</span><div><div class="t">完整教程</div><div class="d">从预设开始，五步做完</div></div><span class="chev">›</span></div>
<div class="tip">改动只影响你选中的那个界面，其他界面保持原样。</div>
</div></div></body></html>
