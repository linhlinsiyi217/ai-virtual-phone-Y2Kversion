<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0}
body{background:#fafafb;font-family:"PingFang SC",system-ui;color:#0a0a0a;display:flex;justify-content:center}
.p{width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
.bar{height:52px;display:flex;align-items:center;justify-content:center;position:relative}
.bar b{font-size:16px}
.bar .q{position:absolute;right:14px;width:24px;height:24px;border-radius:50%;border:1px solid #dcdce2;color:#8a8a8e;font-size:13px;display:grid;place-items:center}
.body{flex:1;overflow:auto;padding:6px 16px 40px}
.card{background:#fff;border-radius:22px;padding:6px 0;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.04)}
.sec{font-size:12px;color:#8a8a8e;margin:18px 6px 6px}
.it{display:flex;align-items:center;gap:13px;padding:13px 16px}
.it+.it{border-top:.5px solid #f0f0f3}
.ic{width:38px;height:38px;border-radius:12px;background:#f2f2f5;display:grid;place-items:center;font-size:16px}
.t{font-size:16px;line-height:22px;font-weight:500}
.d{font-size:12px;line-height:17px;color:#8a8a8e;margin-top:1px}
.ch{margin-left:auto;color:#c9c9cd}
.hero{margin:14px 6px 2px}
.hero h1{font-size:26px;line-height:32px;font-weight:700}
.hero p{font-size:13px;color:#8a8a8e;margin-top:6px}
</style></head><body><div class="p">
<div class="bar"><b>美化工坊</b><span class="q">?</span></div>
<div class="body">
<div class="hero"><h1>把界面改成你的</h1><p>每一块都能单独调，互不影响。</p></div>
<div class="sec">聊天</div>
<div class="card">
 <div class="it"><span class="ic">💬</span><div><div class="t">聊天与线下</div><div class="d">气泡、背景、输入栏</div></div><span class="ch">›</span></div>
 <div class="it"><span class="ic">🖼</span><div><div class="t">消息页装饰</div><div class="d">列表、联系人、动态、我的</div></div><span class="ch">›</span></div>
</div>
<div class="sec">内容</div>
<div class="card">
 <div class="it"><span class="ic">💭</span><div><div class="t">心声美化</div><div class="d">写法、卡片、出现方式</div></div><span class="ch">›</span></div>
</div>
<div class="sec">参考</div>
<div class="card">
 <div class="it"><span class="ic">#</span><div><div class="t">样式类名</div><div class="d">可复制的选择器</div></div><span class="ch">›</span></div>
 <div class="it"><span class="ic">📘</span><div><div class="t">完整教程</div><div class="d">五步走完一遍</div></div><span class="ch">›</span></div>
</div>
</div></div></body></html>
