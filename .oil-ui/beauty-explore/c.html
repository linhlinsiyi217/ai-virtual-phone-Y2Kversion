<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0}
body{background:#fff;font-family:"PingFang SC",system-ui;color:#0a0a0a;display:flex;justify-content:center}
.p{width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden}
.bar{height:52px;display:flex;align-items:center;justify-content:center;position:relative}
.bar b{font-size:16px}
.bar .q{position:absolute;right:14px;width:24px;height:24px;border-radius:50%;border:1px solid #dcdce2;color:#8a8a8e;font-size:13px;display:grid;place-items:center}
.seg{display:flex;gap:6px;padding:10px 16px}
.seg span{flex:1;text-align:center;font-size:13px;padding:9px 0;border-radius:12px;background:#f4f4f6;color:#6e6e73}
.seg span.on{background:#0a0a0a;color:#fff}
.body{flex:1;overflow:auto;padding:4px 16px 40px}
.big{background:#f4f4f6;border-radius:22px;padding:18px;margin:10px 0}
.big .k{font-size:11px;letter-spacing:.14em;color:#8a8a8e}
.big h3{font-size:19px;margin-top:6px}
.big p{font-size:13px;color:#6e6e73;margin-top:6px;line-height:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cell{background:#f8f8fa;border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.cell b{font-size:15px}
.cell small{font-size:12px;color:#8a8a8e}
.ask{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:1px solid #e6e6ea;border-radius:999px;padding:7px 12px;font-size:12px;color:#6e6e73}
</style></head><body><div class="p">
<div class="bar"><b>美化工坊</b><span class="q">?</span></div>
<div class="seg"><span class="on">聊天</span><span>内容</span><span>参考</span></div>
<div class="body">
<div class="big"><div class="k">CHAT</div><h3>聊天室外观</h3><p>气泡、背景、输入栏分开调，改坏了能一键回到预设。</p>
<div class="ask">? 这些改动会影响哪些页面</div></div>
<div class="grid">
 <div class="cell"><b>消息页装饰</b><small>列表 / 联系人 / 动态 / 我的</small></div>
 <div class="cell"><b>心声美化</b><small>写法 / 卡片 / 动效</small></div>
 <div class="cell"><b>样式类名</b><small>复制选择器</small></div>
 <div class="cell"><b>完整教程</b><small>五步做完</small></div>
</div>
</div></div></body></html>
