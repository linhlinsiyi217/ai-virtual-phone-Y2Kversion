<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A 分组卡片</title><style>
*{box-sizing:border-box;margin:0}
body{background:#f2f2f5;font-family:"PingFang SC","Noto Sans SC",sans-serif;color:#0a0a0a;display:flex;justify-content:center}
.phone{width:390px;height:844px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.bar{height:54px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;border-bottom:.5px solid #e6e6ea}
.nav{height:48px;display:flex;align-items:center;gap:6px;padding:0 16px;color:#6e6e73;font-size:15px}
.scroll{flex:1;overflow:auto;padding:8px 16px 40px}
.sec{font-size:12px;line-height:16px;letter-spacing:.12em;color:#6e6e73;font-weight:650;margin:24px 4px 8px}
.card{background:#f4f4f6;border-radius:24px;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:58px}
.row+.row{box-shadow:inset 0 .5px 0 #e0e0e6}
.ico{width:32px;height:32px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:15px}
.t{font-size:17px;line-height:24px;font-weight:500}
.s{font-size:14px;line-height:21px;color:#6e6e73}
.ch{margin-left:auto;color:#c4c4c8;font-size:18px}
.acct{background:#f4f4f6;border-radius:24px;padding:16px;display:flex;align-items:center;gap:12px;margin-top:4px}
.av{width:52px;height:52px;border-radius:50%;background:#e6e6ea}
body{background:#fff}
</style></head><body><div class="phone">
<div class="bar">设置</div>
<div class="scroll">
 <div class="acct"><div class="av"></div><div><div class="t">林思伊</div><div class="s">账号、密码与登录</div></div><span class="ch">›</span></div>
 <div class="sec">接口与声音</div>
 <div class="card">
  <div class="row"><span class="ico">⌘</span><div><div class="t">API 配置</div><div class="s">模型与密钥</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico">♪</span><div><div class="t">语音</div><div class="s">角色声音与朗读</div></div><span class="ch">›</span></div>
 </div>
 <div class="sec">内容与规则</div>
 <div class="card">
  <div class="row"><span class="ico">✎</span><div><div class="t">预设</div><div class="s">开场白与提示词</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico">◎</span><div><div class="t">世界书</div><div class="s">设定与关键词</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico">±</span><div><div class="t">正则规则</div><div class="s">文本替换</div></div><span class="ch">›</span></div>
 </div>
 <div class="sec">连接</div>
 <div class="card">
  <div class="row"><span class="ico">☁</span><div><div class="t">云服务部署</div><div class="s">备份 / 推送一站配置</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico">✉</span><div><div class="t">微信接入</div><div class="s">iLink Bot</div></div><span class="ch">›</span></div>
 </div>
 <div class="sec">运行</div>
 <div class="card">
  <div class="row"><span class="ico">◔</span><div><div class="t">真实时间感知</div><div class="s">注入时间戳</div></div><span style="margin-left:auto;width:46px;height:28px;border-radius:14px;background:#30d158"></span></div>
  <div class="row"><span class="ico">⏱</span><div><div class="t">后台保活</div><div class="s">切后台保持运行</div></div><span style="margin-left:auto;width:46px;height:28px;border-radius:14px;background:#e6e6ea"></span></div>
 </div>
</div></div></body></html>
