<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B 编辑排版</title><style>
*{box-sizing:border-box;margin:0}
body{background:#fff;font-family:"PingFang SC","Noto Sans SC",sans-serif;color:#0a0a0a;display:flex;justify-content:center}
.phone{width:390px;height:844px;background:#fff;display:flex;flex-direction:column}
.top{padding:24px 22px 10px}
.h{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.meta{font-size:13px;color:#8a8a8e;margin-top:6px}
.scroll{flex:1;overflow:auto;padding:8px 0 40px}
.sec{font-size:11px;letter-spacing:.18em;color:#8a8a8e;padding:22px 22px 6px;font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:15px 22px;border-bottom:.5px solid #e6e6ea}
.row:first-of-type{border-top:.5px solid #e6e6ea}
.ico{font-size:16px;color:#8a8a8e;width:22px;text-align:center}
.t{font-size:16px;line-height:22px}
.s{font-size:12px;line-height:17px;color:#8a8a8e;margin-top:2px}
.arr{margin-left:auto;color:#c9c9cd}
</style></head><body><div class="phone">
<div class="top"><div class="h">设置</div><div class="meta">林思伊 · 本机账号</div></div>
<div class="scroll">
 <div class="sec">接口与声音</div>
 <div class="row"><span class="ico">⌘</span><div><div class="t">API 配置</div><div class="s">模型与密钥</div></div><span class="arr">›</span></div>
 <div class="row"><span class="ico">♪</span><div><div class="t">语音</div><div class="s">角色声音与朗读</div></div><span class="arr">›</span></div>
 <div class="sec">内容与规则</div>
 <div class="row"><span class="ico">✎</span><div><div class="t">预设</div><div class="s">开场白与提示词</div></div><span class="arr">›</span></div>
 <div class="row"><span class="ico">◎</span><div><div class="t">世界书</div><div class="s">设定与关键词</div></div><span class="arr">›</span></div>
 <div class="row"><span class="ico">±</span><div><div class="t">正则规则</div><div class="s">文本替换</div></div><span class="arr">›</span></div>
 <div class="sec">连接</div>
 <div class="row"><span class="ico">☁</span><div><div class="t">云服务部署</div><div class="s">备份 / 推送一站配置</div></div><span class="arr">›</span></div>
 <div class="row"><span class="ico">✉</span><div><div class="t">微信接入</div><div class="s">iLink Bot</div></div><span class="arr">›</span></div>
 <div class="sec">运行</div>
 <div class="row"><span class="ico">◔</span><div><div class="t">真实时间感知</div><div class="s">注入时间戳</div></div><span style="margin-left:auto;width:44px;height:26px;border-radius:13px;background:#0a0a0a"></span></div>
 <div class="row"><span class="ico">⏱</span><div><div class="t">后台保活</div><div class="s">切后台保持运行</div></div><span style="margin-left:auto;width:44px;height:26px;border-radius:13px;background:#e6e6ea"></span></div>
</div></div></body></html>
