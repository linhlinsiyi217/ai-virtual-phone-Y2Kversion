<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 柔白卡片</title><style>
*{box-sizing:border-box;margin:0}
body{background:#faf8f5;font-family:"PingFang SC","Noto Sans SC",sans-serif;color:#111;display:flex;justify-content:center}
.phone{width:390px;height:844px;background:#faf8f5;display:flex;flex-direction:column}
.bar{height:54px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.scroll{flex:1;overflow:auto;padding:4px 16px 40px}
.sec{font-size:12px;color:#98938c;font-weight:600;margin:22px 6px 8px}
.card{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);padding:6px 0;margin-bottom:6px}
.row{display:flex;align-items:center;gap:13px;padding:11px 14px}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px}
.c1{background:#eef0ff;color:#5b6cff}.c2{background:#fdeef4;color:#e0508a}.c3{background:#e9f7f0;color:#2fa86a}.c4{background:#fdf2e6;color:#d88b2a}
.t{font-size:16px;line-height:22px;font-weight:500}
.s{font-size:12.5px;line-height:18px;color:#98938c}
.ch{margin-left:auto;color:#cfcac2}
.acct{background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.05);padding:14px;display:flex;gap:12px;align-items:center;margin-top:10px}
.av{width:50px;height:50px;border-radius:16px;background:#f1ece4}
</style></head><body><div class="phone">
<div class="bar">设置</div>
<div class="scroll">
 <div class="acct"><div class="av"></div><div><div class="t">林思伊</div><div class="s">账号、密码与登录</div></div><span class="ch">›</span></div>
 <div class="sec">接口与声音</div>
 <div class="card">
  <div class="row"><span class="ico c1">⌘</span><div><div class="t">API 配置</div><div class="s">模型与密钥</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico c2">♪</span><div><div class="t">语音</div><div class="s">角色声音与朗读</div></div><span class="ch">›</span></div>
 </div>
 <div class="sec">内容与规则</div>
 <div class="card">
  <div class="row"><span class="ico c2">✎</span><div><div class="t">预设</div><div class="s">开场白与提示词</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico c3">◎</span><div><div class="t">世界书</div><div class="s">设定与关键词</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico c4">±</span><div><div class="t">正则规则</div><div class="s">文本替换</div></div><span class="ch">›</span></div>
 </div>
 <div class="sec">连接</div>
 <div class="card">
  <div class="row"><span class="ico c1">☁</span><div><div class="t">云服务部署</div><div class="s">备份 / 推送一站配置</div></div><span class="ch">›</span></div>
  <div class="row"><span class="ico c3">✉</span><div><div class="t">微信接入</div><div class="s">iLink Bot</div></div><span class="ch">›</span></div>
 </div>
 <div class="sec">运行</div>
 <div class="card">
  <div class="row"><span class="ico c4">◔</span><div><div class="t">真实时间感知</div><div class="s">注入时间戳</div></div><span style="margin-left:auto;width:46px;height:28px;border-radius:14px;background:#30d158"></span></div>
  <div class="row"><span class="ico c1">⏱</span><div><div class="t">后台保活</div><div class="s">切后台保持运行</div></div><span style="margin-left:auto;width:46px;height:28px;border-radius:14px;background:#ece7df"></span></div>
 </div>
</div></div></body></html>
