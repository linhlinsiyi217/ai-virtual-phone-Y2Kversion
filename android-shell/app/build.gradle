plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名：CI 里通过环境变量注入 keystore（见 android-shell/README.md）；
// 没有配置时 release 构建产出未签名 APK，debug 构建始终可直接安装测试。
def ksFile = System.getenv("SHELL_KEYSTORE_FILE")
def siteUrl = (System.getenv("SHELL_SITE_URL") ?: "https://example.invalid").replaceAll('/+$', '')

android {
    namespace 'app.floatphone.shell'
    // Health Connect 1.1.0 requires compileSdk 36; runtime target stays 34.
    compileSdk 36

    defaultConfig {
        applicationId "app.yykphone.shell"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.0.12"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    // 先验证 keystore 能否真的打开：密钥库损坏或密码不匹配时不要用它签名，
    // 否则打包阶段会抛 KeytoolException 让整个构建失败。
    def ksPassword = System.getenv("SHELL_KEYSTORE_PASSWORD") ?: ""
    def ksUsable = false
    if (ksFile) {
        try {
            def store = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
            new File(ksFile).withInputStream { stream -> store.load(stream, ksPassword.toCharArray()) }
            // 光能打开库还不够：私钥的密码、别名任一不对，打包阶段仍会抛 Cannot recover key
            def ksAlias = System.getenv("SHELL_KEY_ALIAS")
            def ksKeyPass = System.getenv("SHELL_KEY_PASSWORD") ?: ksPassword
            def resolvedAlias = ksAlias ?: (store.aliases().hasMoreElements() ? store.aliases().nextElement() : null)
            if (resolvedAlias == null) throw new IllegalStateException("密钥库里没有别名")
            def key = store.getKey(resolvedAlias, ksKeyPass.toCharArray())
            if (key == null) throw new IllegalStateException("取不到私钥")
            System.setProperty("shel.gradle.keyok", "1")
            ksUsable = true
        } catch (Throwable ignored) {
            logger.lifecycle("SHELL_KEYSTORE: 密钥库无法读取，本次 release 产出未签名包")
            ksUsable = false
        }
    }

    if (ksUsable) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword ksPassword
                keyAlias System.getenv("SHELL_KEY_ALIAS")
                keyPassword System.getenv("SHELL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksUsable) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
