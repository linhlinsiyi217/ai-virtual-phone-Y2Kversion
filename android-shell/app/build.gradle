plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名：CI 里通过环境变量注入 keystore（见 android-shell/README.md）。
// 本地没有注入密钥时仍允许生成未签名 release，便于调试；正式 CI 工作流
// 会在构建前强制校验四项 Secret，并且只上传已验证的 release APK。
def ksFile = System.getenv("SHELL_KEYSTORE_FILE")
// v1.0.13：后台连接改为账号门控；正式域名可匿名访问、不带部署哈希。
// 预览地址（...-<hash>-<user>.vercel.app）
// 会被 Vercel 的部署保护拦成登录页，所以这里做一次兜底替换。
def PRODUCTION_SITE = "https://ai-virtual-phone-y2-kversion-jeir.vercel.app"
def rawSiteUrl = (System.getenv("SHELL_SITE_URL") ?: "").trim().replaceAll('/+$', '')
def isPreviewUrl = rawSiteUrl ==~ /https:\/\/[A-Za-z0-9-]+-[a-z0-9]{6,}-[A-Za-z0-9-]+\.vercel\.app/
def siteUrl = (rawSiteUrl && !isPreviewUrl) ? rawSiteUrl : PRODUCTION_SITE
if (rawSiteUrl && isPreviewUrl) {
    logger.lifecycle("SHELL_SITE_URL 指向预览部署（${rawSiteUrl}），已改用正式域名 ${PRODUCTION_SITE}")
}

android {
    namespace 'app.floatphone.shell'
    // Health Connect 1.1.0 requires compileSdk 36; runtime target stays 34.
    compileSdk 36

    defaultConfig {
        applicationId "app.yykphone.shell"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "1.0.14"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    // 先验证 keystore 能否真的打开：密钥库损坏或密码不匹配时不要用它签名，
    // 否则打包阶段会抛 KeytoolException 让整个构建失败。
    def ksStoreType = "JKS"
    def ksPassword = System.getenv("SHELL_KEYSTORE_PASSWORD") ?: ""
    def ksUsable = false
    def resolvedAlias = null
    def resolvedKeyPassword = null
    if (ksFile) {
        try {
            // Java 9+ 的默认类型是 PKCS12；本项目交付的 .jks 明确使用 JKS，
            // 因此这里必须显式指定，否则会被误判为不可用并生成未签名包。
            def store = java.security.KeyStore.getInstance(ksStoreType)
            new File(ksFile).withInputStream { stream -> store.load(stream, ksPassword.toCharArray()) }
            // 光能打开库还不够：私钥的密码、别名任一不对，打包阶段仍会抛 Cannot recover key
            def ksAlias = System.getenv("SHELL_KEY_ALIAS")
            def ksKeyPass = System.getenv("SHELL_KEY_PASSWORD") ?: ksPassword
            resolvedAlias = ksAlias ?: (store.aliases().hasMoreElements() ? store.aliases().nextElement() : null)
            if (resolvedAlias == null) throw new IllegalStateException("密钥库里没有别名")
            def key = store.getKey(resolvedAlias, ksKeyPass.toCharArray())
            if (key == null) throw new IllegalStateException("取不到私钥")
            resolvedKeyPassword = ksKeyPass
            ksUsable = true
        } catch (Throwable error) {
            if (ksFile) {
                throw new GradleException(
                    "SHELL_KEYSTORE: 无法读取 JKS 或私钥密码不匹配（${error.class.simpleName}: ${error.message ?: 'unknown error'}）",
                    error
                )
            }
            ksUsable = false
        }
    }

    if (ksUsable) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storeType ksStoreType
                storePassword ksPassword
                keyAlias resolvedAlias
                keyPassword resolvedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksUsable) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
